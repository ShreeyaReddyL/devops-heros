# Values used when installing the kube-prometheus-stack for CampusFix observability.
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --values session21-python/monitoring/prometheus-values.yaml
#
# The CampusFix ServiceMonitor carries `release: kube-prometheus-stack`, so the
# release name must stay in sync with monitoring.release in the chart values.

grafana:
  enabled: true
  # Use a NodePort-free access path; port-forward for local use:
  #   kubectl port-forward -n monitoring svc/monitoring-grafana 8080:80
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    # Required so the stack picks up ServiceMonitors from any namespace,
    # including the `campusfix` namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    # Allow the ServiceMonitor to discover workloads by their own labels.
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

# Alertmanager is not required for this project and costs memory.
alertmanager:
  enabled: false

# The built-in Grafana dashboards are optional; the CampusFix dashboard is
# provisioned separately.
grafanaDashboard:
  enabled: true
  sidecar:
    label: grafana_dashboard
  labelValue: "1"

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true