# Values used when installing kube-prometheus-stack for CampusFix observability.
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --values session21-python/monitoring/prometheus-values.yaml
#
# The CampusFix ServiceMonitor carries `release: monitoring`, matching this
# Helm release name and `monitoring.release` in helm/campusfix/values.yaml.

grafana:
  enabled: true
  # Use a NodePort-free access path; port-forward for local use:
  #   kubectl port-forward -n monitoring svc/monitoring-grafana 3001:80
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    # Required so the stack picks up ServiceMonitors from any namespace,
    # including the `campusfix` namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    # Allow the ServiceMonitor to discover workloads by their own labels.
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

# Alertmanager is not required for this project and costs memory.
alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
