# CampusFix frontend server block.
#
# The container runs as the unprivileged `nginx` user (uid 101), so the listener
# is on 8080 and every scratch path is redirected into /tmp.
pid /tmp/nginx.pid;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # React single-page application.
  location / {
    try_files $uri /index.html;
  }

  # Local Docker Compose and Kubernetes service-to-service API proxy.
  # `backend` resolves to the Docker Compose service name locally and to the
  # Helm service name inside the cluster.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Container/Kubernetes liveness probe for the frontend itself.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}