# CampusFix - local development stack.
#   docker compose up --build
#
# Credentials below are LOCAL DEVELOPMENT CREDENTIALS ONLY. They are not
# production secrets and must never be reused outside this compose file.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusfix
      POSTGRES_USER: campusfix
      POSTGRES_PASSWORD: campusfix
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfix -d campusfix"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://campusfix:campusfix@postgres:5432/campusfix
    # Alembic migrations only run once PostgreSQL reports itself healthy,
    # otherwise `alembic upgrade head` races the database startup and fails.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; raise SystemExit(0 if u.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    # Nginx proxies /api to the `backend` service, so wait for it to be healthy.
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Container listens on 8080 as the unprivileged `nginx` user.
      - "3000:8080"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data: