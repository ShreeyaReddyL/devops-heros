{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "campusfix.fullname" . }}
  labels:
    {{- include "campusfix.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /api goes to the backend, everything else to the frontend.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "campusfix.fullname" . }}-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "campusfix.fullname" . }}-frontend
                port:
                  name: http
{{- end }}