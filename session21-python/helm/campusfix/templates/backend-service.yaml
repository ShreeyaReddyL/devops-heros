apiVersion: v1
kind: Service
metadata:
  name: {{ include "campusfix.fullname" . }}-backend
  labels:
    {{- include "campusfix.labels" . | nindent 4 }}
    # Both labels are required: app.kubernetes.io/component is what the
    # ServiceMonitor selects on, without which Prometheus never scrapes /metrics.
    app.kubernetes.io/component: backend
    app: campusfix-backend
spec:
  type: ClusterIP
  selector:
    {{- include "campusfix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.servicePort }}
      targetPort: http
      protocol: TCP