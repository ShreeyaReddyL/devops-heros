apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campusfix.fullname" . }}-frontend
  labels:
    {{- include "campusfix.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "campusfix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "campusfix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        app: campusfix-frontend
    spec:
      securityContext:
        runAsNonRoot: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # Resolves to the Helm-managed backend Service inside the cluster.
            - name: BACKEND_UPSTREAM
              value: "{{ include "campusfix.fullname" . }}-backend:{{ .Values.backend.port }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}