apiVersion: v1
kind: Service
metadata:
  name: {{ include "campusfix.fullname" . }}-frontend
  labels:
    {{- include "campusfix.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
    app: campusfix-frontend
spec:
  type: ClusterIP
  selector:
    {{- include "campusfix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.servicePort }}
      targetPort: http
      protocol: TCP