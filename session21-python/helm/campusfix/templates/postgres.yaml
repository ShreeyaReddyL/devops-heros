{{- if .Values.postgres.enabled }}
{{- if not .Values.postgres.existingSecret }}
# Rendered only when postgres.existingSecret is empty. The credentials below are
# LOCAL DEVELOPMENT DEFAULTS - in a real cluster supply an existing Secret and
# keep the password out of the chart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campusfix.secretName" . }}
  labels:
    {{- include "campusfix.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  database: {{ .Values.postgres.database | quote }}
  url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username .Values.postgres.password (include "campusfix.postgresFullname" .) .Values.postgres.database | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "campusfix.fullname" . }}-postgres
  labels:
    {{- include "campusfix.labels" . | nindent 4 }}
    app: campusfix-postgres
spec:
  type: ClusterIP
  selector:
    {{- include "campusfix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campusfix.fullname" . }}-postgres
  labels:
    {{- include "campusfix.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "campusfix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "campusfix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
        app: campusfix-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "campusfix.secretName" . }}
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "campusfix.secretName" . }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "campusfix.secretName" . }}
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "campusfix.fullname" . }}-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "campusfix.fullname" . }}-postgres-data
  labels:
    {{- include "campusfix.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage | quote }}
{{- end }}