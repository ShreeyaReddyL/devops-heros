# Development overrides: single-writer database, no autoscaling, no ingress.
backend:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 1

postgres:
  storage: 2Gi

hpa:
  enabled: false

ingress:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false