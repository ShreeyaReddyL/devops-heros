# Production overrides. Tags and image names are supplied at release time by the
# CI pipeline (--set backend.tag=<commit sha>), so they are intentionally not
# pinned here.
backend:
  replicaCount: 3
  imagePullPolicy: IfNotPresent

frontend:
  replicaCount: 3
  imagePullPolicy: IfNotPresent

postgres:
  # Supply a real Secret instead of the development default password:
  #   kubectl -n campusfix create secret generic campusfix-postgres \
  #     --from-literal=username=... --from-literal=password=... \
  #     --from-literal=database=campusfix \
  #     --from-literal=url='postgresql+psycopg://...'
  existingSecret: campusfix-postgres
  storage: 20Gi
  storageClassName: gp3

ingress:
  enabled: true
  className: alb
  # Empty host makes the ingress rule reachable through the AWS load balancer
  # address without requiring a custom DNS record.
  host: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    # The EKS demo stack does not install Prometheus Operator.
    enabled: false
