name: CampusFix CI/CD

on:
  push:
    branches: [main, "capstone/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege defaults; individual jobs widen these where needed.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: campusfix

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality gate - tests must pass before anything is built or published.
  # ---------------------------------------------------------------------------
  test:
    name: Backend tests & frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session21-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: session21-python/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests (pytest)
        run: python -m pytest -v backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: session21-python/frontend/package.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: session21-python/frontend

      - name: Build frontend
        run: npm run build
        working-directory: session21-python/frontend

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: session21-python/frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Build -> Trivy security gate -> push to GHCR with the commit SHA tag.
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase characters in image paths, so the repository
      # owner must be lowercased before it is interpolated into a tag.
      - name: Resolve GHCR owner (lowercase)
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./session21-python/backend
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./session21-python/frontend
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}

      # Security gate: the pipeline fails on HIGH or CRITICAL vulnerabilities.
      - name: Trivy scan - backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan - frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Fork pull requests are untrusted, so they never publish. They still run
      # the full build and scan above.
      - name: Push backend image to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./session21-python/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}

      - name: Push frontend image to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./session21-python/frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 3. Optional AWS EKS deployment. Configure AWS_ROLE_ARN only after Terraform
  #    and the one-time cluster bootstrap steps described in terraform/README.md.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EKS via Helm
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/capstone/campusfix-session21') &&
      vars.AWS_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'campusfix-eks' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - uses: azure/setup-helm@v4

      - name: Verify one-time EKS bootstrap is complete
        run: |
          kubectl -n campusfix get secret campusfix-postgres

      - name: Deploy with Helm
        env:
          OWNER: ${{ needs.build-scan-push.outputs.owner }}
        run: |
          helm upgrade --install campusfix ./session21-python/helm/campusfix \
            --namespace campusfix \
            --values ./session21-python/helm/campusfix/values-prod.yaml \
            --set backend.image=${REGISTRY}/${OWNER}/${IMAGE_NAME}-backend \
            --set backend.tag=${GITHUB_SHA} \
            --set frontend.image=${REGISTRY}/${OWNER}/${IMAGE_NAME}-frontend \
            --set frontend.tag=${GITHUB_SHA} \
            --wait --timeout 5m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/campusfix-backend -n campusfix --timeout=180s
          kubectl rollout status deployment/campusfix-frontend -n campusfix --timeout=180s
          kubectl get pods -n campusfix
